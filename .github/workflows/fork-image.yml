name: Fork backend image
on:
  workflow_dispatch:
  push:
    branches: [local/import-ai-v0.18]
    paths:
      - .github/workflows/fork-image.yml
      - docker/main/Dockerfile.fork
      - frigate/**
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/main/Dockerfile.fork
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/billxc/frigate:fork-${{ github.sha }}
